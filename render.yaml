# One-click deploy on Render: New > Blueprint > point at this repo.
services:
  - type: web
    name: readydesk
    runtime: docker
    plan: starter            # a paid plan is needed for the persistent disk below
    healthCheckPath: /health
    disk:
      name: readydesk-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEN4_DB
        value: /data/readydesk.db
      - key: ANTHROPIC_API_KEY   # optional -- without it the service runs in offline mode
        sync: false
